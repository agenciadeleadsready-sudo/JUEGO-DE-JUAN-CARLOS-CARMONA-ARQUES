<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LMC Invoice Delivery v1</title><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;color:#101828;margin:0}.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 8px 24px #0000000b}h1{margin:0 0 8px}.muted{color:#667085}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,button{font:inherit;padding:11px 13px;border-radius:10px;border:1px solid #d0d5dd}button{cursor:pointer;font-weight:700}.primary{background:#4f46e5;color:#fff;border-color:#4f46e5}.green{background:#ecfdf3;color:#027a48;border-color:#abefc6}.wa{background:#25d366;color:#fff;border-color:#25d366}.mail{background:#eef4ff;color:#3538cd;border-color:#c7d7fe}.invoice{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:16px 0;border-top:1px solid #eaecf0}.invoice:first-child{border-top:0}.status{font-size:12px;padding:5px 8px;border-radius:999px;background:#ecfdf3;color:#027a48}.hidden{display:none}.log{font-size:13px;white-space:pre-wrap;background:#101828;color:#d0d5dd;padding:12px;border-radius:10px;max-height:220px;overflow:auto}@media(max-width:700px){.invoice{grid-template-columns:1fr}.wrap{padding:16px}}</style></head><body><div class="wrap"><h1>LMC Invoice Delivery v1</h1><div class="muted">PDF + Email + WhatsApp + trazabilidad</div><div id="auth" class="card"><h3>Acceso</h3><div class="row"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Contraseña"><button class="primary" id="login">Entrar</button></div><div id="authmsg" class="muted"></div></div><div id="app" class="hidden"><div class="card"><div class="row" style="justify-content:space-between"><div><b id="orgname">Organización</b><div class="muted" id="who"></div></div><button id="logout">Salir</button></div></div><div class="card"><h3>Facturas</h3><div class="muted">Descarga el PDF, compártelo o prepara Email/WhatsApp con enlace seguro.</div><div id="invoices"></div></div><div class="card"><h3>Historial de envíos</h3><div id="deliveries" class="muted">Sin registros</div></div><div class="card"><h3>Diagnóstico</h3><div id="log" class="log">Listo.</div></div></div></div><script>
const BASE='https://egbtqmotbaxeqejctplu.supabase.co';const KEY='sb_publishable_s4m6vroqLYqPJPpcmPDobg_NQAYG1BU';const SHARE_BASE=BASE+'/functions/v1/invoice-share?token=';let token='',user=null,org=null,invoiceCache={};
const $=id=>document.getElementById(id), log=x=>{$('log').textContent=new Date().toLocaleTimeString()+' '+x+'\n'+$('log').textContent};
async function api(path,opt={}){const h={'apikey':KEY,'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{}),...(opt.headers||{})};const r=await fetch(BASE+path,{...opt,headers:h});const text=await r.text();if(!r.ok)throw new Error(text||('HTTP '+r.status));try{return JSON.parse(text)}catch{return text}}
async function login(){try{$('authmsg').textContent='Entrando...';const email=$('email').value.trim(),password=$('pass').value;if(!email||!password){$('authmsg').textContent='Escribe email y contraseña';return}const s=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});token=s.access_token;user=s.user;sessionStorage.setItem('lmc_token',token);sessionStorage.setItem('lmc_user',JSON.stringify(user));$('authmsg').textContent='Acceso correcto';await loadApp()}catch(e){$('authmsg').textContent='No se pudo entrar: '+e.message}}
async function boot(){token=sessionStorage.getItem('lmc_token')||'';try{user=JSON.parse(sessionStorage.getItem('lmc_user')||'null')}catch{}if(token&&user){try{await loadApp()}catch(e){sessionStorage.clear();token='';user=null}}}
async function loadApp(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');const ms=await api('/rest/v1/memberships?select=organization_id,role&user_id=eq.'+encodeURIComponent(user.id)+'&status=eq.active&limit=1');if(!ms?.length)throw new Error('Sin membresía activa');const m=ms[0];const os=await api('/rest/v1/organizations?select=*&id=eq.'+encodeURIComponent(m.organization_id)+'&limit=1');org=os[0];$('orgname').textContent=org.name;$('who').textContent=(user.email||'Usuario')+' · '+m.role;await refresh()}
async function refresh(){await loadInvoices();await loadDeliveries()}
async function loadInvoices(){const inv=await api('/rest/v1/invoices?select=*&organization_id=eq.'+encodeURIComponent(org.id)+'&order=issued_at.desc&limit=30');invoiceCache={};(inv||[]).forEach(x=>invoiceCache[x.id]=x);const ids=[...new Set((inv||[]).map(x=>x.customer_id))];let customers={};if(ids.length){const c=await api('/rest/v1/customers?select=id,first_name,last_name,company_name,email,phone&id=in.('+ids.join(',')+')');(c||[]).forEach(x=>customers[x.id]=x)}$('invoices').innerHTML=(inv||[]).length?(inv||[]).map(i=>{const c=customers[i.customer_id]||{},name=c.company_name||[c.first_name,c.last_name].filter(Boolean).join(' ')||i.customer_name;return `<div class="invoice"><div><b>${i.full_number}</b> · ${name}<div class="muted">${i.issue_date} · ${Number(i.total).toFixed(2)} € · ${c.email||'sin email'} · ${c.phone||'sin teléfono'}</div></div><div class="row"><button onclick="downloadPDF('${i.id}')">PDF</button><button class="green" onclick="sharePDF('${i.id}')">Compartir PDF</button><button class="mail" onclick="sendEmail('${i.id}','${(c.email||'').replace(/'/g,'&#39;')}')">Email</button><button class="wa" onclick="sendWA('${i.id}','${(c.phone||'').replace(/'/g,'&#39;')}')">WhatsApp</button></div></div>`}).join(''):'<div class="muted">No hay facturas emitidas.</div>'}
async function invoiceData(id){const inv=invoiceCache[id];const lines=await api('/rest/v1/invoice_lines?select=*&invoice_id=eq.'+encodeURIComponent(id)+'&order=created_at.asc');return{inv,lines:lines||[]}}
async function buildPDF(id){if(!window.jspdf)throw new Error('No se pudo cargar el generador PDF');const {inv,lines}=await invoiceData(id),{jsPDF}=window.jspdf,d=new jsPDF();let y=18;d.setFontSize(18);d.text('FACTURA '+inv.full_number,14,y);y+=10;d.setFontSize(10);d.text('Fecha: '+inv.issue_date,14,y);y+=10;d.setFontSize(12);d.text('Emisor',14,y);y+=6;d.setFontSize(10);[inv.issuer_name,inv.issuer_tax_id,inv.issuer_address].filter(Boolean).forEach(t=>{d.text(String(t),14,y);y+=5});y+=4;d.setFontSize(12);d.text('Cliente',14,y);y+=6;d.setFontSize(10);[inv.customer_name,inv.customer_tax_id,inv.customer_email].filter(Boolean).forEach(t=>{d.text(String(t),14,y);y+=5});y+=8;for(const l of lines){d.text(String(l.description).slice(0,55),14,y);d.text(Number(l.gross_amount).toFixed(2)+' €',170,y);y+=7}y+=5;d.text('Base: '+Number(inv.subtotal).toFixed(2)+' €',125,y);y+=6;d.text('IVA: '+Number(inv.tax_total).toFixed(2)+' €',125,y);y+=7;d.setFontSize(12);d.text('TOTAL: '+Number(inv.total).toFixed(2)+' €',125,y);return{doc:d,name:inv.full_number+'.pdf'}}
window.downloadPDF=async id=>{try{const {doc,name}=await buildPDF(id);doc.save(name);log('PDF descargado '+name)}catch(e){log('PDF: '+e.message)}};
async function rpc(name,body){return api('/rest/v1/rpc/'+name,{method:'POST',body:JSON.stringify(body)})}
async function prepare(id,channel,recipient){const d=await rpc('prepare_invoice_delivery',{p_invoice_id:id,p_channel:channel,p_recipient:recipient||null,p_expires_hours:168});return d[0]}
async function mark(id,status){await rpc('mark_invoice_delivery_event',{p_delivery_id:id,p_status:status,p_error_message:null})}
window.sharePDF=async id=>{try{const prep=await prepare(id,'system_share',null),{doc,name}=await buildPDF(id),file=new File([doc.output('blob')],name,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:'Factura '+invoiceCache[id].full_number,files:[file]});await mark(prep.delivery_id,'shared')}else{doc.save(name);await mark(prep.delivery_id,'shared');alert('Se ha descargado el PDF para adjuntarlo manualmente.')}await loadDeliveries()}catch(e){if(e.name!=='AbortError')log('Compartir: '+e.message)}};
window.sendEmail=async(id,email)=>{try{if(!email){email=prompt('Email del cliente:')||'';if(!email)return}const prep=await prepare(id,'email',email),link=SHARE_BASE+encodeURIComponent(prep.token),inv=invoiceCache[id];location.href='mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent('Factura '+inv.full_number)+'&body='+encodeURIComponent('Hola,\n\nLe enviamos su factura '+inv.full_number+'.\n\nPuede consultarla aquí durante 7 días:\n'+link+'\n\nGracias.');await mark(prep.delivery_id,'shared');await loadDeliveries()}catch(e){log('Email: '+e.message)}};
window.sendWA=async(id,phone)=>{try{if(!phone){phone=prompt('Teléfono con prefijo país:')||'';if(!phone)return}phone=phone.replace(/\D/g,'');if(phone.length===9)phone='34'+phone;const prep=await prepare(id,'whatsapp',phone),link=SHARE_BASE+encodeURIComponent(prep.token),inv=invoiceCache[id];window.open('https://wa.me/'+phone+'?text='+encodeURIComponent('Hola, te enviamos la factura '+inv.full_number+'. Puedes abrirla aquí durante 7 días: '+link),'_blank');await mark(prep.delivery_id,'shared');await loadDeliveries()}catch(e){log('WhatsApp: '+e.message)}};
async function loadDeliveries(){const d=await api('/rest/v1/invoice_deliveries?select=id,invoice_id,channel,recipient,status,prepared_at&organization_id=eq.'+encodeURIComponent(org.id)+'&order=created_at.desc&limit=50');$('deliveries').innerHTML=(d||[]).length?(d||[]).map(x=>`<div style="padding:10px 0;border-top:1px solid #eaecf0"><b>${x.channel}</b> · ${x.recipient||'sistema'} · <span class="status">${x.status}</span><div class="muted">${new Date(x.prepared_at).toLocaleString()} · ${invoiceCache[x.invoice_id]?.full_number||x.invoice_id}</div></div>`).join(''):'Sin registros'}
$('login').addEventListener('click',login);$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logout').addEventListener('click',()=>{sessionStorage.clear();location.reload()});boot();
</script></body></html>
