<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factura LMC</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;color:#101828;margin:0;padding:24px}.page{max-width:820px;margin:auto;background:white;padding:36px;border-radius:18px;box-shadow:0 12px 30px #0001}h1{margin:0 0 8px}.muted{color:#667085}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:26px 0}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:12px;border-bottom:1px solid #e4e7ec;text-align:left}.totals{margin-left:auto;margin-top:24px;width:320px}.totals div{display:flex;justify-content:space-between;padding:7px 0}.total{font-weight:700;font-size:18px}.actions{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}.btn{padding:12px 18px;background:#4f46e5;color:#fff;border-radius:10px;border:0;cursor:pointer;font-weight:700}.error{color:#b42318}@media(max-width:650px){body{padding:10px}.page{padding:20px}.grid{grid-template-columns:1fr}.totals{width:100%}}@media print{body{background:white;padding:0}.page{box-shadow:none;border-radius:0}.actions{display:none}}</style></head>
<body><div class="page" id="page"><h1>Cargando factura…</h1><div class="muted">Un momento.</div></div>
<script>
const API='https://egbtqmotbaxeqejctplu.supabase.co/functions/v1/invoice-share';let payload=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function boot(){const token=new URLSearchParams(location.search).get('token');if(!token){fail('Enlace no válido');return}try{const r=await fetch(API+'?format=json&token='+encodeURIComponent(token));if(!r.ok){fail(await r.text());return}payload=await r.json();render()}catch(e){fail('No se pudo cargar la factura')}}
function fail(m){document.getElementById('page').innerHTML='<h1>No se puede abrir la factura</h1><p class="error">'+esc(m)+'</p>'}
function render(){const {invoice:i,lines}=payload;const rows=(lines||[]).map(l=>'<tr><td>'+esc(l.description)+'</td><td>'+esc(l.quantity)+'</td><td>'+Number(l.unit_price_gross).toFixed(2)+' €</td><td>'+Number(l.tax_rate).toFixed(2)+'%</td><td>'+Number(l.gross_amount).toFixed(2)+' €</td></tr>').join('');document.getElementById('page').innerHTML='<h1>Factura '+esc(i.full_number)+'</h1><div class="muted">Fecha: '+esc(i.issue_date)+'</div><div class="grid"><div><b>Emisor</b><br>'+esc(i.issuer_name)+'<br>'+esc(i.issuer_tax_id)+'<br>'+esc(i.issuer_address)+'</div><div><b>Cliente</b><br>'+esc(i.customer_name)+'<br>'+esc(i.customer_tax_id)+'<br>'+esc(i.customer_email)+'</div></div><table><thead><tr><th>Concepto</th><th>Cant.</th><th>Precio</th><th>IVA</th><th>Total</th></tr></thead><tbody>'+rows+'</tbody></table><div class="totals"><div><span>Base imponible</span><span>'+Number(i.subtotal).toFixed(2)+' €</span></div><div><span>IVA</span><span>'+Number(i.tax_total).toFixed(2)+' €</span></div><div class="total"><span>Total</span><span>'+Number(i.total).toFixed(2)+' €</span></div></div><div class="actions"><button class="btn" onclick="window.print()">Imprimir / Guardar PDF</button><button class="btn" onclick="downloadPDF()">Descargar PDF</button></div>'}
window.downloadPDF=()=>{if(!payload)return;const i=payload.invoice,lines=payload.lines||[];const {jsPDF}=window.jspdf;const d=new jsPDF();let y=18;d.setFontSize(18);d.text('FACTURA '+i.full_number,14,y);y+=10;d.setFontSize(10);d.text('Fecha: '+i.issue_date,14,y);y+=10;d.setFontSize(12);d.text('Emisor',14,y);y+=6;d.setFontSize(10);[i.issuer_name,i.issuer_tax_id,i.issuer_address].filter(Boolean).forEach(t=>{d.text(String(t),14,y);y+=5});y+=4;d.setFontSize(12);d.text('Cliente',14,y);y+=6;d.setFontSize(10);[i.customer_name,i.customer_tax_id,i.customer_email].filter(Boolean).forEach(t=>{d.text(String(t),14,y);y+=5});y+=8;for(const l of lines){d.text(String(l.description).slice(0,65),14,y);d.text(Number(l.gross_amount).toFixed(2)+' EUR',165,y);y+=7}y+=5;d.text('Base: '+Number(i.subtotal).toFixed(2)+' EUR',125,y);y+=6;d.text('IVA: '+Number(i.tax_total).toFixed(2)+' EUR',125,y);y+=7;d.setFontSize(12);d.text('TOTAL: '+Number(i.total).toFixed(2)+' EUR',125,y);d.save(i.full_number+'.pdf')};
boot();
</script></body></html>
