<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>B.TOUS · Peluquería</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f0ea;color:#181716}.app{max-width:520px;margin:auto;padding:20px 18px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:30px;font-weight:900;letter-spacing:.15em}.sub{font-size:11px;letter-spacing:.3em;color:#777}.btn{border:0;border-radius:13px;padding:13px 15px;font-weight:800;cursor:pointer}.dark{background:#191817;color:#fff}.gold{background:#c49a61}.soft{background:#eee7df}.light{background:#fff}.full{width:100%}.hero{background:#191817;color:#fff;border-radius:24px;padding:26px;margin:20px 0}.hero h1{font-size:34px;line-height:1.05;margin:8px 0}.hero p{color:#ddd3ca}.actions{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border:1px solid #e3dbd2;border-radius:20px;padding:15px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}.card.sel{outline:2px solid #191817}.price{font-weight:900}.panel,.appt{background:#fff;border:1px solid #e3dbd2;border-radius:20px;padding:18px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:13px;border:1px solid #d9cec3;border-radius:11px;font-size:16px;background:#fff}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{padding:10px 3px;border:1px solid #d9cec3;border-radius:10px;background:#fff;font-weight:800}.slot.sel{background:#191817;color:#fff}.slot.busy{opacity:.35;text-decoration:line-through}.status{min-height:22px;margin-top:10px;font-weight:800}.ok{color:#15723d}.err{color:#9b2626}.hidden{display:none!important}.nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(488px,calc(100% - 28px));display:grid;grid-template-columns:repeat(3,1fr);background:#191817ed;padding:8px;border-radius:18px}.nav button{border:0;background:transparent;color:#aaa;padding:11px}.nav button.on{background:#fff;color:#222;border-radius:11px;font-weight:800}.modal{display:none;position:fixed;inset:0;background:#0009;align-items:end;justify-content:center;padding:14px;z-index:9}.modal.show{display:flex}.sheet{width:min(520px,100%);background:#fff;border-radius:25px;padding:20px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#eee7df;border-radius:12px;padding:4px}.tab{border:0;background:transparent;padding:10px;font-weight:800;border-radius:9px}.tab.on{background:#fff}.appt{margin:10px 0}.notice{background:#fff7e9;border:1px solid #ead4a8;border-radius:14px;padding:10px 12px;margin:10px 0;font-size:13px}.help{font-size:13px;color:#666;margin-top:10px}.check{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:8px}.check input{width:auto}@media(max-width:390px){.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="top"><div><div class="brand">B.TOUS</div><div class="sub">PELUQUERÍA</div></div><button id="topAccount" class="btn soft" type="button">Mi cuenta</button></div><main id="home"><section class="hero"><small>TU MOMENTO · TU ESTILO</small><h1>Reserva tu cita.</h1><p>Elige servicio, día y hora y confirma tu cita.</p><div class="actions"><button class="btn gold" id="signupTop" type="button">Darse de alta</button><button class="btn light" id="loginTop" type="button">Entrar</button></div></section><h2>Servicios</h2><div class="grid" id="cards"></div><h2 id="book">Pedir cita</h2><div class="panel"><div id="who" class="notice">No has iniciado sesión.</div><div class="field"><label>Servicio</label><select id="service"></select></div><div class="field"><label>Día</label><input id="date" type="date"></div><div class="field"><label>Hora disponible</label><div class="slots" id="slots"></div></div><button class="btn dark full" type="button" id="bookBtn">Confirmar cita</button><div id="status" class="status"></div></div></main><main id="appointments" class="hidden"><h2>Mis citas</h2><div id="apptList"></div></main><main id="account" class="hidden"><h2>Mi cuenta</h2><div id="accountBox"></div></main></div><nav class="nav"><button class="on" data-view="home">Inicio</button><button data-view="appointments">Mis citas</button><button data-view="account">Mi cuenta</button></nav><div class="modal" id="auth"><div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Cuenta B.TOUS</h2><button class="btn soft" id="close" type="button">✕</button></div><div class="tabs"><button class="tab on" data-form="signup" type="button">Darse de alta</button><button class="tab" data-form="login" type="button">Entrar</button></div><form id="signup"><div class="field"><label>Nombre</label><input id="rname" required></div><div class="field"><label>Teléfono</label><input id="rphone" inputmode="tel" required></div><div class="field"><label>Contraseña</label><input id="rpass" type="password" minlength="4" required></div><button class="btn dark full">Crear cuenta</button><div id="signupStatus" class="status"></div></form><form id="login" class="hidden"><div class="field"><label>Teléfono</label><input id="lphone" inputmode="tel" required></div><div class="field"><label>Contraseña</label><input id="lpass" type="password" required></div><label class="check"><input id="showPass" type="checkbox"> Mostrar contraseña</label><button class="btn dark full" style="margin-top:10px">Entrar</button><div id="loginStatus" class="status"></div><div id="loginHelp" class="help"></div></form></div></div><script>(()=>{const $=id=>document.getElementById(id),qa=s=>[...document.querySelectorAll(s)],R=(k,f)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}},W=(k,v)=>localStorage.setItem(k,JSON.stringify(v));const USERS='btous_users',APPTS='btous_appointments',SESSION='btous_session_v5',SERVICES='btous_services';const norm=p=>{let s=String(p||'').replace(/\D/g,'');if(s.startsWith('0034'))s=s.slice(4);else if(s.startsWith('34')&&s.length===11)s=s.slice(2);return s};const passOf=u=>String(u?.pass??u?.password??u?.clave??'');const DEF=[{id:'lavar',n:'Lavar',p:8,i:'🫧'},{id:'peinar',n:'Peinar',p:18,i:'💇‍♀️'},{id:'cortar',n:'Cortar',p:22,i:'✂️'},{id:'tenir',n:'Teñir',p:35,i:'🎨'},{id:'mechas',n:'Mechas',p:55,i:'✨'},{id:'tratamiento',n:'Tratamiento',p:25,i:'🧴'}],TIMES=['09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30'];const M=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});const services=()=>R(SERVICES,DEF).map((s,i)=>({...DEF.find(d=>d.id===s.id),...s,i:s.i||DEF[i]?.i||'✂️'})),users=()=>R(USERS,[]),appts=()=>R(APPTS,[]),active=u=>u&&u.active!==false;function migrateUsers(){const us=users();let changed=false;const out=us.map(u=>{const p=norm(u.phone);if(p&&p!==u.phone){changed=true;return {...u,phone:p}}return u});if(changed)W(USERS,out)}migrateUsers();let sel='lavar',time='';function currentUser(){const s=R(SESSION,null);if(!s)return null;const u=users().find(x=>norm(x.phone)===norm(s.phone));if(!u||!active(u)){localStorage.removeItem(SESSION);return null}return u}function stat(t,ok=false){$('status').textContent=t;$('status').className='status '+(t?(ok?'ok':'err'):'')}function fstat(id,t,ok=false){$(id).textContent=t;$(id).className='status '+(t?(ok?'ok':'err'):'')}function renderWho(){const u=currentUser();$('who').textContent=u?`Cita para: ${u.name} · ${u.phone}`:'No has iniciado sesión.'}function renderServices(){const a=services();$('cards').innerHTML=a.map(x=>`<div class="card ${x.id===sel?'sel':''}" data-service="${x.id}"><div style="font-size:28px">${x.i}</div><strong>${x.n}</strong><div class="price">${M(x.p)}</div></div>`).join('');$('service').innerHTML=a.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${x.n} · ${M(x.p)}</option>`).join('');qa('[data-service]').forEach(c=>c.onclick=()=>{sel=c.dataset.service;time='';renderServices();renderSlots()})}function renderSlots(){const d=$('date').value,busy=new Set(appts().filter(a=>a.date===d&&a.status!=='cancelled').map(a=>a.time));$('slots').innerHTML=TIMES.map(t=>`<button type="button" class="slot ${busy.has(t)?'busy':''} ${time===t?'sel':''}" data-time="${t}" ${busy.has(t)?'disabled':''}>${t}</button>`).join('');qa('[data-time]:not(:disabled)').forEach(b=>b.onclick=()=>{time=b.dataset.time;stat('');renderSlots()})}function openAuth(which){$('auth').classList.add('show');qa('[data-form]').forEach(b=>b.classList.toggle('on',b.dataset.form===which));$('signup').classList.toggle('hidden',which!=='signup');$('login').classList.toggle('hidden',which!=='login');fstat('signupStatus','');fstat('loginStatus','');$('loginHelp').textContent=''}function show(v){['home','appointments','account'].forEach(id=>$(id).classList.toggle('hidden',id!==v));qa('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));if(v==='appointments')renderAppts();if(v==='account')renderAccount();if(v==='home')renderWho()}function renderAppts(){const u=currentUser();if(!u){$('apptList').innerHTML='<div class="panel">Entra o date de alta para ver tus citas.</div>';return}const arr=appts().filter(a=>norm(a.phone)===norm(u.phone));$('apptList').innerHTML=arr.length?arr.map(a=>`<div class="appt"><strong>${services().find(s=>s.id===a.service)?.n||a.service}</strong><div>${a.date} · ${a.time}</div><b>${a.status==='cancelled'?'CANCELADA':'CONFIRMADA'}</b></div>`).join(''):'<div class="panel">No tienes citas.</div>'}function renderAccount(){const u=currentUser();$('accountBox').innerHTML=u?`<div class="panel"><strong>${u.name}</strong><p>📞 ${u.phone}</p><button class="btn dark full" id="logout">Cerrar sesión</button></div>`:`<div class="panel"><button class="btn gold full" id="newClient">Darse de alta</button><button class="btn soft full" style="margin-top:8px" id="enterClient">Entrar</button></div>`;if(u)$('logout').onclick=()=>{localStorage.removeItem(SESSION);renderAccount();renderWho()};else{$('newClient').onclick=()=>openAuth('signup');$('enterClient').onclick=()=>openAuth('login')}}$('signup').onsubmit=e=>{e.preventDefault();const name=$('rname').value.trim(),phone=norm($('rphone').value),pass=$('rpass').value;if(phone.length<9)return fstat('signupStatus','Teléfono no válido.');const us=users(),old=us.find(x=>norm(x.phone)===phone);if(old)return fstat('signupStatus',active(old)?'Ese teléfono ya está registrado. Pulsa Entrar.':'Este cliente está dado de baja. Contacta con B.TOUS.');us.push({name,phone,pass,active:true,created:new Date().toISOString()});W(USERS,us);W(SESSION,{phone});$('auth').classList.remove('show');renderWho();stat('Cuenta creada correctamente.',true)};$('login').onsubmit=e=>{e.preventDefault();const phone=norm($('lphone').value),pass=$('lpass').value,us=users();const byPhone=us.find(x=>norm(x.phone)===phone);if(!byPhone){fstat('loginStatus','Este teléfono no está registrado en este móvil.');$('loginHelp').textContent='Pulsa “Darse de alta” y registra el mismo teléfono. No es un error de contraseña.';return}if(!active(byPhone)){fstat('loginStatus','Tu cuenta está dada de baja. Contacta con B.TOUS.');return}if(passOf(byPhone)!==pass){fstat('loginStatus','La contraseña no coincide.');$('loginHelp').textContent='Comprueba mayúsculas, espacios y que sea la contraseña con la que se creó esta cuenta.';return}W(SESSION,{phone:byPhone.phone});$('auth').classList.remove('show');renderWho();stat(`Sesión iniciada como ${byPhone.name}.`,true)};$('bookBtn').onclick=()=>{const u=currentUser();if(!u){stat('Primero entra o date de alta.');openAuth('login');return}if(!$('date').value)return stat('Selecciona un día.');if(!time)return stat('Selecciona una hora.');const arr=appts();if(arr.some(a=>a.date===$('date').value&&a.time===time&&a.status!=='cancelled'))return stat('Esa hora ya está ocupada.');arr.push({id:'C'+Date.now(),name:u.name,phone:u.phone,service:sel,date:$('date').value,time,status:'confirmed'});W(APPTS,arr);stat('✓ Cita confirmada correctamente',true);time='';renderSlots();setTimeout(()=>show('appointments'),300)};$('showPass').onchange=()=>{$('lpass').type=$('showPass').checked?'text':'password'};$('signupTop').onclick=()=>openAuth('signup');$('loginTop').onclick=()=>openAuth('login');$('topAccount').onclick=()=>show('account');$('close').onclick=()=>$('auth').classList.remove('show');qa('[data-form]').forEach(b=>b.onclick=()=>openAuth(b.dataset.form));qa('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));$('service').onchange=e=>{sel=e.target.value;time='';renderServices();renderSlots()};$('date').onchange=()=>{time='';renderSlots()};const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$('date').min=d.toISOString().slice(0,10);$('date').value=$('date').min;renderServices();renderSlots();renderWho()})();</script></body></html>
