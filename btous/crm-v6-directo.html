<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM B.TOUS</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f3ef;color:#181716}.hidden{display:none!important}.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(145deg,#eee6dc,#fff);z-index:20}.box{width:min(440px,100%);background:#fff;border:1px solid #ddd2c7;border-radius:26px;padding:24px}.brand{font-size:30px;font-weight:900;letter-spacing:.14em}.sub{font-size:11px;letter-spacing:.24em;color:#777}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid #d6cbc0;border-radius:11px;font-size:16px}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer}.dark{background:#181716;color:#fff}.soft{background:#eee8e2}.green{background:#e3f5e8;color:#156b35}.red{background:#f9e1e1;color:#8a2323}.wa{background:#25d366;color:#063c1a}.wrap{max-width:1280px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.card,.panel{background:#fff;border:1px solid #e5dfd7;border-radius:20px;padding:18px}.big{font-size:30px;font-weight:900;margin-top:8px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:0;border-radius:12px;padding:11px 14px;background:#e9e4dd;font-weight:800}.tab.on{background:#191817;color:#fff}.row{display:grid;grid-template-columns:1.2fr .9fr .8fr .65fr .8fr 2.1fr;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee8e2}.client{display:grid;grid-template-columns:1.3fr 1fr .7fr .7fr 1fr;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee8e2}.service{display:grid;grid-template-columns:1fr 150px 130px 120px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee8e2}.service input{width:100%;padding:11px;border:1px solid #d6cbc0;border-radius:10px}.invoice{display:grid;grid-template-columns:1.1fr 1.1fr .8fr .8fr 1fr;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee8e2}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900}.ok{background:#e3f5e8;color:#176b37}.off{background:#eee;color:#666}.cancel{background:#f7dfdf;color:#852323}.actions{display:flex;gap:6px;flex-wrap:wrap}.note{font-size:13px;color:#777}.msg{min-height:20px;margin-top:8px;color:#9b2626;font-weight:800;font-size:13px}@media(max-width:950px){.row,.client,.service,.invoice{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}}@media(max-width:520px){.wrap{padding:14px}.cards,.row,.client,.service,.invoice{grid-template-columns:1fr}}</style></head><body><div id="gate" class="gate"><div class="box"><div class="brand">B.TOUS</div><div class="sub">CRM ONLINE</div><section id="setup"><h2>Crear acceso</h2><p class="note">Primera vez: crea tú mismo el usuario y la contraseña del CRM.</p><form id="setupForm"><div class="field"><label>Nombre</label><input id="adminName" value="Administrador"></div><div class="field"><label>Usuario</label><input id="setupUser" required></div><div class="field"><label>Contraseña</label><input id="setupPass" type="password" minlength="4" required></div><button class="btn dark" style="width:100%">Crear acceso</button><div id="setupMsg" class="msg"></div></form></section><section id="login" class="hidden"><h2>Entrar al CRM</h2><form id="loginForm"><div class="field"><label>Usuario</label><input id="loginUser" required></div><div class="field"><label>Contraseña</label><input id="loginPass" type="password" required></div><button class="btn dark" style="width:100%">Entrar</button><div id="loginMsg" class="msg"></div></form></section></div></div><div id="crm" class="wrap hidden"><div class="top"><div><div class="brand">B.TOUS</div><div class="sub">CRM · SINCRONIZADO ONLINE</div></div><div><strong>● Online</strong> <button id="logout" class="btn soft">Cerrar CRM</button></div></div><div class="cards"><div class="card">Clientes activos<div class="big" id="kClients">0</div></div><div class="card">Citas activas<div class="big" id="kAppts">0</div></div><div class="card">Facturación cobrada<div class="big" id="kRevenue">0,00 €</div></div><div class="card">Pendiente<div class="big" id="kPending">0,00 €</div></div></div><div class="tabs"><button class="tab on" data-tab="agenda">Agenda</button><button class="tab" data-tab="clients">Clientes</button><button class="tab" data-tab="billing">Facturación</button><button class="tab" data-tab="services">Servicios</button></div><section id="agenda" class="panel"><h2>Agenda</h2><div id="agendaList"></div></section><section id="clients" class="panel hidden"><h2>Clientes</h2><div id="clientList"></div></section><section id="billing" class="panel hidden"><h2>Facturación</h2><div id="invoiceList"></div></section><section id="services" class="panel hidden"><h2>Servicios y precios</h2><div id="serviceList"></div></section></div><script>const API='https://ep-super-smoke-avc56uvx.apirest.c-11.us-east-1.aws.neon.tech/neondb/rest/v1',KEY='btous_admin_token_v6',$=id=>document.getElementById(id),qa=s=>[...document.querySelectorAll(s)];let token=localStorage.getItem(KEY)||'';const money=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}),date=d=>{if(!d)return'';let p=String(d).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d},phone=p=>{let s=String(p||'').replace(/\D/g,'');if(s.length===9)s='34'+s;return s},price=v=>{let n=Number(String(v||'').trim().replace(/€/g,'').replace(/\s/g,'').replace(',','.'));return Number.isFinite(n)&&n>=0?Math.round(n*100)/100:null};async function rpc(name,args={}){const r=await fetch(`${API}/rpc/${name}`,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(args)});const t=await r.text();let data=null;try{data=t?JSON.parse(t):null}catch{data=t}if(!r.ok)throw new Error((data&&data.message)||t||`Error ${r.status}`);return data}function showCrm(){$('gate').classList.add('hidden');$('crm').classList.remove('hidden')}function showGate(){$('crm').classList.add('hidden');$('gate').classList.remove('hidden')}async function init(){try{let d=await rpc('btous_admin_is_setup',{}),isSetup=d===true||d?.[0]===true||d?.[0]?.btous_admin_is_setup===true;$('setup').classList.toggle('hidden',isSetup);$('login').classList.toggle('hidden',!isSetup);if(token){try{await loadAll();showCrm()}catch{token='';localStorage.removeItem(KEY)}}}catch(e){$('setupMsg').textContent='No se pudo conectar: '+e.message}}async function loadAll(){const[st,cl,ap,sv,iv]=await Promise.all([rpc('btous_admin_stats',{p_token:token}),rpc('btous_admin_clients',{p_token:token}),rpc('btous_admin_appointments',{p_token:token}),rpc('btous_admin_services',{p_token:token}),rpc('btous_admin_invoices',{p_token:token})]);renderStats(st?.[0]||{});renderClients(cl||[]);renderAgenda(ap||[]);renderServices(sv||[]);renderInvoices(iv||[])}function renderStats(x){$('kClients').textContent=x.active_clients||0;$('kAppts').textContent=x.active_appointments||0;$('kRevenue').textContent=money(x.revenue);$('kPending').textContent=money(x.pending)}function renderClients(rows){$('clientList').innerHTML=rows.length?rows.map(x=>`<div class="client"><strong>${x.name||'Cliente'}</strong><span>${x.phone||''}</span><span>${x.appointments_count} cita(s)</span><span class="badge ${x.active?'ok':'off'}">${x.active?'ACTIVO':'BAJA'}</span><span><button class="btn ${x.active?'red':'green'}" data-client="${x.id}" data-on="${x.active?'0':'1'}">${x.active?'Dar de baja':'Dar de alta'}</button></span></div>`).join(''):'<p>No hay clientes.</p>';qa('[data-client]').forEach(b=>b.onclick=async()=>{await rpc('btous_admin_set_customer_active',{p_token:token,p_customer_id:b.dataset.client,p_active:b.dataset.on==='1'});await loadAll()})}function renderAgenda(rows){$('agendaList').innerHTML=rows.length?rows.map(a=>`<div class="row"><span><strong>${a.customer_name}</strong><br><small>${a.customer_phone}</small></span><span>${a.service_name}<br><small>${money(a.price)}</small></span><span>${date(a.appointment_date)}</span><span>${String(a.appointment_time).slice(0,5)}</span><span class="badge ${a.status==='cancelled'?'cancel':'ok'}">${a.status==='done'?'REALIZADA':a.status==='cancelled'?'CANCELADA':'CONFIRMADA'}</span><span class="actions">${a.status==='confirmed'?`<button class="btn wa" data-wa="${a.id}" data-kind="reminder">WhatsApp recordatorio</button><button class="btn soft" data-wa="${a.id}" data-kind="confirm">WhatsApp confirmación</button><button class="btn green" data-status="${a.id}" data-s="done">Realizada</button><button class="btn red" data-status="${a.id}" data-s="cancelled">Cancelar</button>`:''}</span></div>`).join(''):'<p>No hay citas.</p>';qa('[data-wa]').forEach(b=>b.onclick=()=>{let a=rows.find(x=>x.id===b.dataset.wa),txt=b.dataset.kind==='reminder'?`Hola ${a.customer_name}, te recordamos tu cita en B.TOUS el ${date(a.appointment_date)} a las ${String(a.appointment_time).slice(0,5)}, servicio: ${a.service_name}. ¡Te esperamos!`:`Hola ${a.customer_name}, te confirmamos tu cita en B.TOUS el ${date(a.appointment_date)} a las ${String(a.appointment_time).slice(0,5)}, servicio: ${a.service_name}. Responde OK para confirmar asistencia.`;window.open(`https://wa.me/${phone(a.customer_phone)}?text=${encodeURIComponent(txt)}`,'_blank')});qa('[data-status]').forEach(b=>b.onclick=async()=>{await rpc('btous_admin_set_appointment_status',{p_token:token,p_appointment_id:b.dataset.status,p_status:b.dataset.s});await loadAll()})}function renderServices(rows){$('serviceList').innerHTML=rows.map(s=>`<div class="service"><strong>${s.name}</strong><input inputmode="decimal" value="${Number(s.price).toFixed(2).replace('.',',')}" data-price="${s.id}"><button class="btn dark" data-save="${s.id}">Guardar precio</button><span id="m-${s.id}"></span></div>`).join('');qa('[data-save]').forEach(b=>b.onclick=async()=>{let i=qa(`[data-price="${b.dataset.save}"]`)[0],n=price(i.value),m=$('m-'+b.dataset.save);if(n===null){m.textContent='Precio no válido';return}await rpc('btous_admin_update_service_price',{p_token:token,p_service_id:b.dataset.save,p_price:n});m.textContent='Guardado ✓';await loadAll()})}function renderInvoices(rows){$('invoiceList').innerHTML=rows.length?rows.map(i=>`<div class="invoice"><strong>${i.invoice_number}</strong><span>${i.customer_name}</span><span>${money(i.total)}</span><span class="badge ${i.status==='paid'?'ok':'cancel'}">${i.status==='paid'?'COBRADA':'PENDIENTE'}</span><span>${i.status!=='paid'?`<button class="btn green" data-paid="${i.id}">Marcar cobrada</button>`:''}</span></div>`).join(''):'<p>No hay facturas.</p>';qa('[data-paid]').forEach(b=>b.onclick=async()=>{await rpc('btous_admin_mark_invoice_paid',{p_token:token,p_invoice_id:b.dataset.paid});await loadAll()})}$('setupForm').onsubmit=async e=>{e.preventDefault();$('setupMsg').textContent='';try{let r=(await rpc('btous_admin_setup',{p_username:$('setupUser').value.trim(),p_password:$('setupPass').value,p_name:$('adminName').value.trim()}))?.[0];if(!r||r.status!=='ok')throw new Error(r?.message||'No se pudo crear el acceso');token=r.token;localStorage.setItem(KEY,token);await loadAll();showCrm()}catch(err){$('setupMsg').textContent=err.message}};$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='';try{let r=(await rpc('btous_admin_login',{p_username:$('loginUser').value.trim(),p_password:$('loginPass').value}))?.[0];if(!r||r.status!=='ok')throw new Error(r?.message||'Acceso incorrecto');token=r.token;localStorage.setItem(KEY,token);await loadAll();showCrm()}catch(err){$('loginMsg').textContent=err.message}};$('logout').onclick=async()=>{try{if(token)await rpc('btous_admin_logout',{p_token:token})}catch{}token='';localStorage.removeItem(KEY);showGate();$('setup').classList.add('hidden');$('login').classList.remove('hidden')};qa('[data-tab]').forEach(b=>b.onclick=()=>{qa('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));['agenda','clients','billing','services'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab))});init();</script></body></html>
