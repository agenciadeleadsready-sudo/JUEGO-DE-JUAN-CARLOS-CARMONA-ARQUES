<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#181716"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="B.TOUS CRM"><link rel="manifest" href="./crm-manifest.webmanifest"><link rel="icon" href="./btous-crm-icon.svg"><link rel="apple-touch-icon" href="./btous-crm-icon.svg"><title>B.TOUS CRM</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f2ee;color:#181716}.shell{display:flex;flex-direction:column;height:100%}.installbar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#181716;color:#fff;z-index:5;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.12em}.installbar small{opacity:.75;flex:1}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:850;cursor:pointer}.install{background:#fff;color:#181716}.help{background:#c49a61;color:#17120d}.frame{border:0;width:100%;flex:1;background:#f5f2ee}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{width:min(520px,100%);background:#fff;border-radius:22px;padding:22px}.box h2{margin-top:0}.box p{line-height:1.5}.close{width:100%;background:#181716;color:#fff}@media(display-mode:standalone){.installbar{display:none}}@media(max-width:560px){.installbar small{display:none}.installbar{justify-content:space-between}}</style></head><body><div class="shell"><div class="installbar"><div class="brand">B.TOUS CRM</div><small>Instálalo como aplicación en PC o móvil</small><button id="installBtn" class="btn install" type="button">Instalar CRM</button><button id="helpBtn" class="btn help" type="button">Cómo instalar</button></div><iframe class="frame" src="./crm-v10-agenda.html" title="B.TOUS CRM"></iframe></div><div id="modal" class="modal"><div class="box"><h2>Instalar B.TOUS CRM</h2><div id="instructions"></div><button id="closeBtn" class="btn close" type="button">Cerrar</button></div></div><script>let deferredPrompt=null;const installBtn=document.getElementById('installBtn'),modal=document.getElementById('modal'),instructions=document.getElementById('instructions');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.textContent='Instalar CRM';});window.addEventListener('appinstalled',()=>{installBtn.textContent='CRM instalado ✓';deferredPrompt=null;});function deviceInstructions(){const ua=navigator.userAgent.toLowerCase();if(/iphone|ipad|ipod/.test(ua))return '<p><strong>iPhone/iPad:</strong></p><p>1. Abre esta página en Safari.<br>2. Pulsa el botón <strong>Compartir</strong> (cuadrado con flecha hacia arriba).<br>3. Pulsa <strong>Añadir a pantalla de inicio</strong>.<br>4. Confirma con <strong>Añadir</strong>.</p>';if(/android/.test(ua))return '<p><strong>Android:</strong></p><p>Pulsa <strong>Instalar CRM</strong>. Si no aparece la instalación automática, abre el menú ⋮ de Chrome y elige <strong>Instalar aplicación</strong> o <strong>Añadir a pantalla de inicio</strong>.</p>';if(/macintosh|mac os x/.test(ua))return '<p><strong>Mac:</strong></p><p>En Chrome o Edge pulsa <strong>Instalar CRM</strong>. En Safari puedes usar <strong>Archivo → Añadir al Dock</strong> si tu versión lo permite.</p>';return '<p><strong>Windows/PC:</strong></p><p>Abre esta página en Chrome o Edge y pulsa <strong>Instalar CRM</strong>. El CRM quedará como una aplicación independiente y podrás fijarlo al escritorio o al menú Inicio.</p>'}function showHelp(){instructions.innerHTML=deviceInstructions();modal.classList.add('show')}installBtn.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();const choice=await deferredPrompt.userChoice;if(choice.outcome==='accepted')installBtn.textContent='CRM instalado ✓';deferredPrompt=null}else showHelp()};document.getElementById('helpBtn').onclick=showHelp;document.getElementById('closeBtn').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./crm-sw.js').catch(()=>{}))}</script></body></html>
