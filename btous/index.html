<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171615"><title>B.TOUS · Peluquería</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#f1ebe4,#fff);color:#191817}.app{max-width:520px;margin:auto;padding:20px 18px 100px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:28px;font-weight:900;letter-spacing:.18em}.sub{font-size:11px;color:#777;letter-spacing:.35em;text-transform:uppercase}.hero{margin-top:20px;background:#1b1917;color:#fff;border-radius:30px;padding:28px 24px;box-shadow:0 20px 50px #0002}.hero h1{font-size:34px;line-height:1.05;margin:10px 0}.hero p{color:#ddd3ca;line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:800;cursor:pointer}.light{background:#fff}.gold{background:#c49a61}.dark{background:#1b1917;color:#fff}.soft{background:#eee7df}.full{width:100%}.section{margin-top:24px}.section h2{font-size:21px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.service{background:#fff;border:1px solid #e3dbd2;border-radius:20px;padding:16px;min-height:125px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}.service.sel{outline:2px solid #222}.ico{font-size:28px}.price{font-weight:900}.panel{background:#fff;border:1px solid #e3dbd2;border-radius:22px;padding:18px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:14px;border:1px solid #ddd3c9;border-radius:13px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{padding:11px 4px;border:1px solid #ddd3c9;border-radius:11px;background:#fff;font-weight:800}.slot.sel{background:#1b1917;color:#fff}.slot.busy{opacity:.3;text-decoration:line-through}.nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(488px,calc(100% - 28px));display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#171615ed;padding:8px;border-radius:20px}.nav button{border:0;background:transparent;color:#aaa;padding:11px 3px;border-radius:13px;font-weight:800}.nav button.on{background:#fff;color:#222}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:end;justify-content:center;padding:14px;z-index:5}.modal.show{display:flex}.sheet{width:min(520px,100%);background:#fff;border-radius:28px;padding:22px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#eee7df;border-radius:13px;padding:4px;margin-bottom:14px}.tab{border:0;background:transparent;padding:11px;border-radius:10px;font-weight:800}.tab.on{background:#fff}.hidden{display:none}.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-20px);background:#111;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;transition:.2s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}.appt{background:#fff;border:1px solid #e3dbd2;border-radius:17px;padding:14px;margin:10px 0}.badge{font-size:11px;font-weight:900;color:#18764b}.download{margin-top:14px;background:#fff;border:1px solid #e3dbd2;border-radius:18px;padding:14px;display:flex;gap:10px;align-items:center}.download div{flex:1}.download small{display:block;color:#777;margin-top:3px}@media(max-width:390px){.grid{grid-template-columns:1fr}}</style></head><body><div class="toast" id="toast"></div><div class="app"><div class="top"><div><div class="brand">B.TOUS</div><div class="sub">Peluquería</div></div><button class="btn soft" id="accountBtn">👤</button></div><main id="home"><section class="hero"><small>TU MOMENTO · TU ESTILO</small><h1>Reserva tu cita en segundos.</h1><p>Elige servicio, día y hora. Confirma tu cita desde el móvil.</p><div class="actions"><button class="btn light" id="goBookBtn">Pedir cita</button><button class="btn gold" id="signupBtn">Darse de alta</button></div></section><div class="download"><div><strong>Descarga B.TOUS</strong><small>Añádela a la pantalla de inicio de tu móvil.</small></div><button class="btn dark" id="installBtn">Descargar APP</button></div><section class="section"><h2>Servicios</h2><div class="grid" id="services"></div></section><section class="section" id="book"><h2>Pedir cita</h2><div class="panel"><div class="field"><label>Servicio</label><select id="serviceSelect"></select></div><div class="field"><label>Día</label><input id="dateInput" type="date"></div><div class="field"><label>Hora disponible</label><div class="slots" id="slots"></div></div><button class="btn dark full" id="confirmAppointmentBtn">Confirmar cita</button></div></section></main><main id="appointments" class="hidden"><h2>Mis citas</h2><div id="apptList"></div></main><main id="profile" class="hidden"><h2>Mi cuenta</h2><div id="profileBox"></div></main></div><nav class="nav"><button class="on" data-view="home">Inicio</button><button data-view="appointments">Mis citas</button><button data-view="profile">Mi cuenta</button></nav><div class="modal" id="authModal"><div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Cuenta B.TOUS</h2><button class="btn soft" id="closeAuthBtn">✕</button></div><div class="tabs"><button class="tab on" data-auth="signupForm">Darse de alta</button><button class="tab" data-auth="loginForm">Entrar</button></div><form id="signupForm"><div class="field"><label>Nombre</label><input id="regName" required></div><div class="field"><label>Teléfono</label><input id="regPhone" inputmode="tel" required></div><div class="field"><label>Contraseña</label><input id="regPass" type="password" minlength="4" required></div><button class="btn dark full">Crear cuenta</button></form><form id="loginForm" class="hidden"><div class="field"><label>Teléfono</label><input id="logPhone" inputmode="tel" required></div><div class="field"><label>Contraseña</label><input id="logPass" type="password" required></div><button class="btn dark full">Entrar</button></form></div></div><script>(()=>{const byId=id=>document.getElementById(id),q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];const S=[{id:'lavar',n:'Lavar',p:8,i:'🫧'},{id:'peinar',n:'Peinar',p:18,i:'💇‍♀️'},{id:'cortar',n:'Cortar',p:22,i:'✂️'},{id:'tenir',n:'Teñir',p:35,i:'🎨'},{id:'mechas',n:'Mechas',p:55,i:'✨'},{id:'tratamiento',n:'Tratamiento',p:25,i:'🧴'}],T=['09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30'];const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),norm=p=>(p||'').replace(/\D/g,'').replace(/^34(?=\d{9}$)/,'');let selectedService='lavar',selectedTime=null;const bc='BroadcastChannel'in window?new BroadcastChannel('btous-sync'):null;const notify=()=>bc&&bc.postMessage('sync');function toast(t){byId('toast').textContent=t;byId('toast').classList.add('show');setTimeout(()=>byId('toast').classList.remove('show'),2200)}const getSession=()=>read('btous_session',null),getUsers=()=>read('btous_users',[]),getAppointments=()=>read('btous_appointments',[]);function renderServices(){byId('services').innerHTML=S.map(x=>`<div class="service ${x.id===selectedService?'sel':''}" data-service="${x.id}"><div><div class="ico">${x.i}</div><strong>${x.n}</strong></div><div class="price">${x.p} €</div></div>`).join('');byId('serviceSelect').innerHTML=S.map(x=>`<option value="${x.id}" ${x.id===selectedService?'selected':''}>${x.n} · ${x.p} €</option>`).join('');qa('[data-service]').forEach(el=>el.onclick=()=>{selectedService=el.dataset.service;selectedTime=null;renderServices();renderSlots()})}function renderSlots(){const d=byId('dateInput').value;if(!d){byId('slots').innerHTML='';return}const busy=getAppointments().filter(a=>a.date===d&&a.status!=='cancelled').map(a=>a.time);byId('slots').innerHTML=T.map(t=>`<button type="button" class="slot ${busy.includes(t)?'busy':''}" data-time="${t}" ${busy.includes(t)?'disabled':''}>${t}</button>`).join('');qa('[data-time]:not(.busy)').forEach(el=>el.onclick=()=>{selectedTime=el.dataset.time;qa('[data-time]').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')})}function openAuth(which='signupForm'){byId('authModal').classList.add('show');switchAuth(which)}function switchAuth(which){qa('[data-auth]').forEach(x=>x.classList.toggle('on',x.dataset.auth===which));byId('signupForm').classList.toggle('hidden',which!=='signupForm');byId('loginForm').classList.toggle('hidden',which!=='loginForm')}qa('[data-auth]').forEach(x=>x.onclick=()=>switchAuth(x.dataset.auth));byId('closeAuthBtn').onclick=()=>byId('authModal').classList.remove('show');byId('signupBtn').onclick=()=>openAuth('signupForm');byId('accountBtn').onclick=()=>getSession()?showView('profile'):openAuth('signupForm');byId('goBookBtn').onclick=()=>byId('book').scrollIntoView({behavior:'smooth'});byId('signupForm').onsubmit=e=>{e.preventDefault();const p=norm(byId('regPhone').value),name=byId('regName').value.trim(),pass=byId('regPass').value;if(p.length<9)return toast('Teléfono no válido');const users=getUsers();if(users.some(x=>x.phone===p)){switchAuth('loginForm');byId('logPhone').value=p;return toast('Ese teléfono ya está registrado')}users.push({name,phone:p,pass,created:new Date().toISOString()});write('btous_users',users);write('btous_session',{name,phone:p});notify();byId('authModal').classList.remove('show');toast('Alta completada')};byId('loginForm').onsubmit=e=>{e.preventDefault();const p=norm(byId('logPhone').value),pass=byId('logPass').value,u=getUsers().find(x=>x.phone===p&&x.pass===pass);if(!u)return toast('Teléfono o contraseña incorrectos');write('btous_session',{name:u.name,phone:u.phone});notify();byId('authModal').classList.remove('show');toast('Bienvenido/a')};byId('confirmAppointmentBtn').onclick=()=>{const ses=getSession();if(!ses){openAuth('signupForm');return}const d=byId('dateInput').value;if(!d||!selectedTime){toast('Selecciona día y hora');return}const all=getAppointments();if(all.some(x=>x.date===d&&x.time===selectedTime&&x.status!=='cancelled')){selectedTime=null;renderSlots();toast('Esa hora acaba de ocuparse');return}all.push({id:'C'+Date.now(),phone:ses.phone,name:ses.name,service:selectedService,date:d,time:selectedTime,status:'confirmed',created:new Date().toISOString()});write('btous_appointments',all);notify();selectedTime=null;renderSlots();renderAppointments();toast('✓ Cita confirmada')};function renderAppointments(){const ses=getSession();if(!ses){byId('apptList').innerHTML='<div class="panel">Entra o date de alta para ver tus citas.</div>';return}const a=getAppointments().filter(x=>x.phone===ses.phone).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));byId('apptList').innerHTML=a.length?a.map(x=>{const sv=S.find(s=>s.id===x.service);return `<div class="appt"><strong>${sv?.i||'✂️'} ${sv?.n||x.service}</strong><div>${x.date} · ${x.time}</div><span class="badge">${x.status==='cancelled'?'CANCELADA':'CONFIRMADA'}</span>${x.status!=='cancelled'?`<br><button class="btn soft" data-cancel="${x.id}">Cancelar</button>`:''}</div>`}).join(''):'<div class="panel">No tienes citas.</div>';qa('[data-cancel]').forEach(b=>b.onclick=()=>cancelAppointment(b.dataset.cancel))}function cancelAppointment(id){write('btous_appointments',getAppointments().map(x=>x.id===id?{...x,status:'cancelled'}:x));notify();renderAppointments();renderSlots();toast('Cita cancelada')}function renderProfile(){const ses=getSession();byId('profileBox').innerHTML=ses?`<div class="panel"><strong>${ses.name}</strong><p>📞 ${ses.phone}</p><button class="btn dark full" id="profileInstallBtn">Descargar APP</button><button class="btn soft full" style="margin-top:8px" id="logoutBtn">Cerrar sesión</button></div>`:'<div class="panel"><button class="btn gold full" id="profileSignupBtn">Darse de alta</button><button class="btn soft full" style="margin-top:8px" id="profileLoginBtn">Entrar</button></div>';if(ses){byId('profileInstallBtn').onclick=installApp;byId('logoutBtn').onclick=()=>{localStorage.removeItem('btous_session');notify();renderProfile();toast('Sesión cerrada')}}else{byId('profileSignupBtn').onclick=()=>openAuth('signupForm');byId('profileLoginBtn').onclick=()=>openAuth('loginForm')}}function showView(v){['home','appointments','profile'].forEach(x=>byId(x).classList.toggle('hidden',x!==v));qa('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));if(v==='appointments')renderAppointments();if(v==='profile')renderProfile()}qa('.nav button').forEach(b=>b.onclick=()=>showView(b.dataset.view));byId('serviceSelect').onchange=e=>{selectedService=e.target.value;selectedTime=null;renderServices();renderSlots()};const today=new Date();today.setMinutes(today.getMinutes()-today.getTimezoneOffset());byId('dateInput').min=today.toISOString().slice(0,10);byId('dateInput').value=byId('dateInput').min;byId('dateInput').onchange=()=>{selectedTime=null;renderSlots()};function installApp(){alert(/iphone|ipad|ipod/i.test(navigator.userAgent)?'En iPhone: pulsa Compartir en Safari y elige “Añadir a pantalla de inicio”.':'En Android: abre el menú del navegador y elige “Instalar aplicación” o “Añadir a pantalla de inicio”.')}byId('installBtn').onclick=installApp;window.addEventListener('storage',()=>{renderSlots();renderAppointments();renderProfile()});if(bc)bc.onmessage=()=>{renderSlots();renderAppointments();renderProfile()};renderServices();renderSlots();})();</script></body></html>
